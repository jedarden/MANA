name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.7.1)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: mana
            asset_name: mana-linux-x86_64

          # macOS Intel
          - target: x86_64-apple-darwin
            os: macos-15
            artifact_name: mana
            asset_name: mana-darwin-x86_64

          # macOS Apple Silicon
          - target: aarch64-apple-darwin
            os: macos-14
            artifact_name: mana
            asset_name: mana-darwin-aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Build release binary
        run: |
          cargo build --release --target ${{ matrix.target }}

      - name: Strip binary (Linux/macOS)
        run: |
          strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

      - name: Create tarball
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../${{ matrix.asset_name }}.tar.gz ${{ matrix.artifact_name }}
          cd ../../..

      - name: Generate SHA256
        run: |
          if [[ "${{ matrix.os }}" == "macos-"* ]]; then
            shasum -a 256 ${{ matrix.asset_name }}.tar.gz > ${{ matrix.asset_name }}.tar.gz.sha256
          else
            sha256sum ${{ matrix.asset_name }}.tar.gz > ${{ matrix.asset_name }}.tar.gz.sha256
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}.tar.gz
            ${{ matrix.asset_name }}.tar.gz.sha256

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.sha256" \) -exec mv {} release/ \;
          ls -la release/

      - name: Get version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: MANA ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: release/*
          body: |
            ## Installation

            Download the appropriate binary for your platform:

            | Platform | File | SHA256 |
            |----------|------|--------|
            | Linux x86_64 | `mana-linux-x86_64.tar.gz` | See `.sha256` file |
            | macOS Intel | `mana-darwin-x86_64.tar.gz` | See `.sha256` file |
            | macOS Apple Silicon | `mana-darwin-aarch64.tar.gz` | See `.sha256` file |

            ### Quick Install

            ```bash
            # Linux x86_64
            curl -LO https://github.com/jedarden/MANA/releases/download/${{ steps.version.outputs.version }}/mana-linux-x86_64.tar.gz
            tar -xzf mana-linux-x86_64.tar.gz
            chmod +x mana
            sudo mv mana /usr/local/bin/

            # macOS (Intel)
            curl -LO https://github.com/jedarden/MANA/releases/download/${{ steps.version.outputs.version }}/mana-darwin-x86_64.tar.gz
            tar -xzf mana-darwin-x86_64.tar.gz
            chmod +x mana
            sudo mv mana /usr/local/bin/

            # macOS (Apple Silicon)
            curl -LO https://github.com/jedarden/MANA/releases/download/${{ steps.version.outputs.version }}/mana-darwin-aarch64.tar.gz
            tar -xzf mana-darwin-aarch64.tar.gz
            chmod +x mana
            sudo mv mana /usr/local/bin/
            ```

            ### Verify Download

            ```bash
            # Verify SHA256 checksum
            sha256sum -c mana-<platform>.tar.gz.sha256
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
